*{box-sizing:border-box}

.karte{background:#fff;width:100%;max-width:400px;padding:32px 28px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}

label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #c5ccd3;border-radius:8px;background:#fff}
input[type=password]:focus{outline:2px solid #2f3a45;outline-offset:1px}
.merken{display:flex;gap:8px;align-items:center;margin:12px 0 18px;font-size:14px;font-weight:400}
button{width:100%;font:inherit;font-weight:600;font-size:16px;background:#2f3a45;color:#fff;border:0;border-radius:8px;padding:12px 22px;cursor:pointer;min-height:46px}
button:disabled{opacity:.6;cursor:wait}
.fehler{color:#b3261e;font-weight:600;min-height:22px;margin:12px 0 0}
.klein{font-size:13px;line-height:19px;color:#6b7580;margin:18px 0 0}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function oeffnen(pw){
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.it, hash:"SHA-256"}, basis, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.daten));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
const f = document.getElementById("f"), fehler = document.getElementById("fehler"), los = document.getElementById("los");
f.addEventListener("submit", async ev => {
  ev.preventDefault(); fehler.textContent = ""; los.disabled = true; los.textContent = "Wird geöffnet …";
  const pw = document.getElementById("pw").value;
  try {
    if (document.getElementById("merk").checked) { try { localStorage.setItem("pa-zugang", pw); } catch (_) {} }
    await oeffnen(pw);
  } catch (e) {
    try { localStorage.removeItem("pa-zugang"); } catch (_) {}
    fehler.textContent = (typeof DecompressionStream === "undefined") ? "Dein Browser ist zu alt. Bitte aktualisiere ihn." : "Das Passwort stimmt nicht.";
    los.disabled = false; los.textContent = "Öffnen";
  }
});
(async () => { let pw = null; try { pw = localStorage.getItem("pa-zugang"); } catch (_) {}
  if (pw) { try { await oeffnen(pw); } catch (_) { try { localStorage.removeItem("pa-zugang"); } catch (e) {} } } })();
</script>
